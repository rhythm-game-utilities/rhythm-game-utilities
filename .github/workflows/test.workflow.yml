name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "include/**/*"
      - "tests/**/*"
      - "RhythmGameUtilities/**/*"
      - "RhythmGameUtilities.Tests/**/*"
      - "!**/*.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - "include/**/*"
      - "tests/**/*"
      - "RhythmGameUtilities/**/*"
      - "RhythmGameUtilities.Tests/**/*"
      - "!**/*.md"
  workflow_dispatch:

jobs:
  test-cpp:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run tests
        run: |
          ./bin/test.sh
          ./bin/documentation-test-cpp.sh
  test-csharp:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0

      - name: Build Release
        run: |
          mkdir -p build
          g++ -std=c++17 -shared -fPIC -o build/libRhythmGameUtilities.so include/RhythmGameUtilities/RhythmGameUtilities.cpp

      - name: Copy Release
        run: |
          cp build/libRhythmGameUtilities.so UnityPackage/Libs/Linux
          cp build/libRhythmGameUtilities.so RhythmGameUtilities/Libs/Linux

      - name: Install dependencies
        run: dotnet restore

      - name: Test
        run: |
          dotnet test RhythmGameUtilities.Tests/*.csproj
          ./bin/documentation-test-csharp.sh
  test-lua:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev
          sudo update-alternatives --set lua-interpreter /usr/bin/lua5.4
          sudo ln -s /usr/include/lua5.4 /usr/include/lua
          lua -v

      - name: Run tests
        working-directory: LuaPlugin/
        run: |
          g++ -std=c++17 -shared -fPIC -o rhythmgameutilities.so lua_bindings.cpp -I../include -I/usr/include/lua5.4
          lua test.lua
          ../bin/documentation-test-lua.sh

  test-copy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Copy files from project to UnityPackage
        run: |
          (cd RhythmGameUtilities && find . -type f -name "*.cs" -not -path '*/obj/*' -not -path '*/bin/*' -exec cp {} ../UnityPackage/{} \;)
          (cd RhythmGameUtilities.Tests && find . -type f -name "*.cs" -not -path '*/obj/*' -not -path '*/bin/*' -exec cp {} ../UnityPackage/Editor/Tests/{} \;)
          cp LICENSE ./UnityPackage/
          cp README.md ./RhythmGameUtilities/
          cp README.md ./UnityPackage/
          cp screenshot.png ./UnityPackage/

      - name: Check for changes
        run: git diff --exit-code
