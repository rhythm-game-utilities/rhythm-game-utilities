name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "include/**/*"
      - "JavaScript/**/*"
      - "RhythmGameUtilities/**/*"
      - "RhythmGameUtilities.Tests/**/*"
      - "tests/**/*"
      - "!**/*.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - "include/**/*"
      - "JavaScript/**/*"
      - "RhythmGameUtilities/**/*"
      - "RhythmGameUtilities.Tests/**/*"
      - "tests/**/*"
      - "!**/*.md"
  workflow_dispatch:

jobs:
  test-cpp:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run tests
        run: ./bin/test.sh

      - name: Run documentation tests
        run: ./bin/documentation-test-cpp.sh
  test-csharp:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0

      - name: Build Release
        run: |
          mkdir -p build
          g++ -std=c++17 -shared -fPIC -o build/libRhythmGameUtilities.so include/RhythmGameUtilities/RhythmGameUtilities.cpp

      - name: Copy Release
        run: |
          cp build/libRhythmGameUtilities.so UnityPackage/Libs/Linux
          cp build/libRhythmGameUtilities.so RhythmGameUtilities/Libs/Linux

      - name: Install dependencies
        run: dotnet restore

      - name: Test
        run: dotnet test RhythmGameUtilities.Tests/*.csproj

      - name: Run Documentation Tests
        run: ./bin/documentation-test-csharp.sh
  test-javascript:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Emscripten
        uses: HandcrankEngine/install-emscripten-package@d578b50f8f7f76ea25c14b13b7df943b31e37891 # v0.3.1

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build Library
        working-directory: JavaScript/
        run: npm run build

      - name: Run Tests
        working-directory: JavaScript/
        run: npm test

      - name: Run Documentation Tests
        run: ./bin/documentation-test-javascript.sh
  test-copy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Copy files from project to UnityPackage
        run: |
          (cd RhythmGameUtilities && find . -type f -name "*.cs" -not -path '*/obj/*' -not -path '*/bin/*' -exec cp {} ../UnityPackage/{} \;)
          (cd RhythmGameUtilities.Tests && find . -type f -name "*.cs" -not -path '*/obj/*' -not -path '*/bin/*' -exec cp {} ../UnityPackage/Editor/Tests/{} \;)
          cp LICENSE ./UnityPackage/
          cp README.md ./RhythmGameUtilities/
          cp README.md ./UnityPackage/
          cp screenshot.png ./UnityPackage/

      - name: Check for changes
        run: git diff --exit-code
